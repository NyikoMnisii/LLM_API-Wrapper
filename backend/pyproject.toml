[project]
name = "agrilite-api"
version = "0.1.0"
description = "Modular FastAPI backend for the Agrilite AI agronomist platform."
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "cachetools>=5.3",
    "slowapi>=0.1.9",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"
