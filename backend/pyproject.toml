[project]
name = "agrilite-api"
version = "0.1.0"
description = "Modular FastAPI backend for the Agrilite AI agronomist platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]",
    "httpx",
    "supabase",
    "google-genai",
    "pydantic-settings",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.fastapi]
entrypoint = "app.main:app"
